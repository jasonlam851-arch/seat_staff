<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挺豪餐廳 - 自動客席控制台</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
        }
      }
    </script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f4f6f9; padding: 15px; margin: 0; color: #333; }
        .title { text-align: center; color: #1a202c; font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        button { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-blue { background-color: #2b6cb0; color: white; }
        #reader { width: 100%; max-width: 340px; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; display: none; }
        .info-title { font-size: 0.85rem; color: #718096; margin-top: 15px; text-transform: uppercase; }
        .info-value { font-size: 2.2rem; font-weight: 700; color: #2b6cb0; font-family: monospace; }
        .timer-box { font-size: 3rem; font-weight: 700; color: #e53e3e; font-family: monospace; background: #fff5f5; border: 1px solid #feb2b2; padding: 10px 0; border-radius: 8px; margin-top: 5px; }
        .alert-toast { background: #2f855a; color: white; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="title">客席智能掃碼台 (全自動)</div>

    <div class="card">
        <div id="reader"></div>
        <button class="btn-blue" id="scanBtn" onclick="toggleCamera()">開啟鏡頭掃描顧客 QR</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div class="info-title">處理顧客號碼</div>
        <div class="val-block" id="resTicket" style="font-size: 2.5rem; font-weight: bold; color: #2b6cb0;">---</div>
        <div id="toastMsg" class="alert-toast"></div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, set, get, serverTimestamp } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyDwUF4-rBRG9QGyti2_Smx_PRZ8sZOZL0A",
            authDomain: "my-queue-system-3bcc5.firebaseapp.com",
            databaseURL: "https://my-queue-system-3bcc5-default-rtdb.firebaseio.com",
            projectId: "my-queue-system-3bcc5",
            storageBucket: "my-queue-system-3bcc5.firebasestorage.app",
            messagingSenderId: "32354532851",
            appId: "1:32354532851:web:4ba48fcc31bb454399a686"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let html5Qr = null;

        window.toggleCamera = function() {
            const readerDiv = document.getElementById('reader');
            const btn = document.getElementById('scanBtn');
            if (html5Qr && html5Qr.isScanning) {
                html5Qr.stop().then(() => { readerDiv.style.display = 'none'; btn.innerText = "開啟鏡頭掃描顧客 QR"; });
            } else {
                readerDiv.style.display = 'block'; btn.innerText = "關閉鏡頭";
                if(!html5Qr) html5Qr = new Html5Qrcode("reader");
                html5Qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess).catch(()=>{
                    alert("請核准相機權限。"); readerDiv.style.display = 'none'; btn.innerText = "開啟鏡頭掃描顧客 QR";
                });
            }
        };

        // 🟢 核心全自動識別邏輯
        function onScanSuccess(uid) {
            toggleCamera(); // 自動關相機
            
            const nodeRef = ref(db, `comboSystem/${uid}`);
            get(nodeRef).then((snap) => {
                const data = snap.val();
                if (!data) { alert("此二維碼已失效或客人已取消排隊。"); return; }

                document.getElementById('resultCard').style.display = 'block';
                document.getElementById('resTicket').innerText = data.ticketNumber;
                const toast = document.getElementById('toastMsg');
                toast.style.display = 'block';

                if (data.status === "waiting") {
                    // 👉 第一次掃描：自動將其改為用餐中，並使用 serverTimestamp 確保絕對同步
                    set(nodeRef, {
                        ...data,
                        status: "dining",
                        startTime: serverTimestamp() // 使用 Firebase 伺服器時間
                    }).then(() => {
                        toast.innerText = "成功：已自動安排入座，倒數計時開始！";
                        toast.style.backgroundColor = "#2f855a";
                    });
                } 
                else if (data.status === "dining") {
                    // 👉 第二次掃描：發現已經在吃了，直接一鍵自動離店洗白
                    set(nodeRef, null).then(() => {
                        toast.innerText = "成功：顧客已用餐完畢離開，網頁已重置！";
                        toast.style.backgroundColor = "#c53030";
                    });
                }
            });
        }
    </script>
</body>
</html>
