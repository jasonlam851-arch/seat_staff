<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>挺豪餐廳 - 綜合客席管理面板</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
        }
      }
    </script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #edf2f7; padding: 15px; margin: 0; }
        h1 { text-align: center; color: #2d3748; font-size: 1.5rem; margin-bottom: 20px; }
        .box { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        
        button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; margin-top: 10px; }
        .btn-scan { background-color: #3182ce; }
        .btn-action-in { background-color: #48bb78; }
        .btn-action-out { background-color: #e53e3e; }
        
        #reader { width: 100%; max-width: 350px; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; display: none; }
        .info-row { margin-bottom: 15px; }
        .lbl { font-size: 0.9rem; color: #718096; text-transform: uppercase; margin-bottom: 3px; }
        .val { font-size: 1.8rem; font-weight: bold; color: #1a202c; font-family: monospace; }
        .badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; }
        .bg-waiting { background: #feebc8; color: #c05621; }
        .bg-dining { background: #fed7d7; color: #9b2c2c; }
    </style>
</head>
<body>

    <h1>挺豪餐廳 - 綜合客席掃碼端</h1>

    <div class="box">
        <div id="reader"></div>
        <button class="btn-scan" id="scanBtn" onclick="toggleScanner()">開啟相機掃描顧客</button>
    </div>

    <div class="box" id="resultBox" style="display: none;">
        
        <div class="info-row">
            <div class="lbl">顧客排隊號碼</div>
            <div class="val" id="custTicket" style="color: #3182ce;">---</div>
        </div>

        <div class="info-row">
            <div class="lbl">登記到訪人數</div>
            <div class="val" id="custGuests" style="font-size: 1.4rem;">- 人</div>
        </div>
        
        <div class="info-row">
            <div class="lbl">當前狀態</div>
            <div style="margin-top: 5px;">
                <span class="badge" id="statusBadge">---</span>
            </div>
        </div>

        <div id="ctrlArea" style="margin-top: 25px;">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, set, get } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyDwUF4-rBRG9QGyti2_Smx_PRZ8sZOZL0A",
            authDomain: "my-queue-system-3bcc5.firebaseapp.com",
            databaseURL: "https://my-queue-system-3bcc5-default-rtdb.firebaseio.com",
            projectId: "my-queue-system-3bcc5",
            storageBucket: "my-queue-system-3bcc5.firebasestorage.app",
            messagingSenderId: "32354532851",
            appId: "1:32354532851:web:4ba48fcc31bb454399a686"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let scannerInstance = null;
        let activeUID = null;

        window.toggleScanner = function() {
            const readerDiv = document.getElementById('reader');
            const btn = document.getElementById('scanBtn');

            if (scannerInstance && scannerInstance.isScanning) {
                scannerInstance.stop().then(() => {
                    readerDiv.style.display = 'none';
                    btn.innerText = "開啟相機掃描顧客";
                });
            } else {
                readerDiv.style.display = 'block';
                btn.innerText = "關閉相機鏡頭";
                if(!scannerInstance) scannerInstance = new Html5Qrcode("reader");
                
                scannerInstance.start(
                    { facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanDone
                ).catch(() => {
                    alert("請開啟瀏覽器相機使用權限。");
                    readerDiv.style.display = 'none';
                    btn.innerText = "開啟相機掃描顧客";
                });
            }
        };

        // 🟢 掃描成功：解碼出客人的專屬 UID
        function onScanDone(decodedText) {
            toggleScanner(); // 關閉相機
            activeUID = decodedText;

            // 讀取該 UID 在雲端的即時排隊與入座資料
            const nodeRef = ref(db, `comboSystem/${activeUID}`);
            get(nodeRef).then((snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    alert("此二維碼無效或已被重置，請讓顧客重新在手機選人數。");
                    return;
                }

                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('custTicket').innerText = data.ticketNumber;
                document.getElementById('custGuests').innerText = data.guestsCount + " 人";
                
                const badge = document.getElementById('statusBadge');
                const ctrl = document.getElementById('ctrlArea');

                if (data.status === "waiting") {
                    badge.innerText = "排隊候位中";
                    badge.className = "badge bg-waiting";
                    ctrl.innerHTML = `<button class="btn-action-in" onclick="clickEnter()">確認顧客入座 (啟動1.5小時限時)</button>`;
                } else if (data.status === "dining") {
                    badge.innerText = "用餐中 / 計時中";
                    badge.className = "badge bg-dining";
                    ctrl.innerHTML = `<button class="btn-action-out" onclick="clickLeave()">確認客人已離開 (重置網頁)</button>`;
                }
            });
        }

        // 店員點擊確認入座
        window.clickEnter = function() {
            if (!activeUID) return;
            // 保持號碼與人數不變，僅將狀態切換為 dining，並注入計時起點
            const nodeRef = ref(db, `comboSystem/${activeUID}`);
            get(nodeRef).then(snap => {
                const currentData = snap.val();
                set(nodeRef, {
                    ...currentData,
                    status: "dining",
                    startTime: Date.now()
                }).then(() => {
                    alert("已確認入座，顧客端網頁已實時切換為限時倒數。");
                    document.getElementById('resultBox').style.display = 'none';
                });
            });
        };

        // 店員點擊確認離開 (重置顧客網頁)
        window.clickLeave = function() {
            if (!activeUID) return;
            const nodeRef = ref(db, `comboSystem/${activeUID}`);
            // 直接拔除雲端此 UID 的節點
            set(nodeRef, null).then(() => {
                alert("已完成離店重置，顧客手機已自動恢復至人數選擇初始狀態。");
                document.getElementById('resultBox').style.display = 'none';
            });
        };
    </script>
</body>
</html>
